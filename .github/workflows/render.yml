name: Render dashboard

on:
  # The Kindle asks for a render (workflow_dispatch) just before each hourly download.
  # The schedule is only a backup for when the Kindle is off; GitHub skips many scheduled runs.
  schedule:
    - cron: "50 */3 * * *"
  push:
    branches: [main]
    paths:
      - todo.md
      - coffee.md
      - render/**
      - fonts/**
      - .github/workflows/render.yml
  workflow_dispatch:
  workflow_call:   # used by add-todo.yml after it commits

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: render
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main   # always the latest to-dos and beans, whatever triggered the run

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: pip install --quiet pillow

      - name: Render
        run: python render/render.py --out out/dashboard.png

      # Publish as a single orphan commit so the repo history doesn't grow every hour.
      # dashboard.png is the screen; meta.json (render time), stale.png and night.png go with it.
      - name: Publish to the output branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard.png meta.json stale.png night.png
          git commit -q -m "Dashboard $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" output
