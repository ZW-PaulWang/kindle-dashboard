name: Render dashboard

on:
  # The Kindle asks for a render (workflow_dispatch) just before each hourly download.
  # The schedule is only a backup for when the Kindle is off; GitHub skips many scheduled runs.
  schedule:
    - cron: "50 */3 * * *"
  push:
    branches: [main]
    paths:
      - todo.md
      - coffee.md
      - menu.md
      - render/**
      - fonts/**
      - kindle/dashboard/**
      - .github/workflows/render.yml
  workflow_dispatch:
    inputs:
      # The Kindle sends its new log lines and a status line with each render request.
      log:
        description: New dashboard.log lines from the Kindle
        required: false
        default: ""
      device:
        description: Kindle status line
        required: false
        default: ""
  workflow_call:   # used by add-todo.yml after it commits

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: render
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main   # always the latest to-dos, beans and menu, whatever triggered the run

      # First, so a newer render that cancels this run seldom loses it. The logs branch is one
      # commit holding kindle.log (the last 5000 lines) and status.txt (the latest status line).
      - name: Save the Kindle's log
        if: ${{ inputs.log != '' || inputs.device != '' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KINDLE_LOG: ${{ inputs.log }}
          KINDLE_DEVICE: ${{ inputs.device }}
        run: |
          mkdir -p "$RUNNER_TEMP/logs" && cd "$RUNNER_TEMP/logs"
          git init -q -b logs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth 1 "$url" logs; then git checkout -q FETCH_HEAD -- . ; fi
          printf '%s\n' "$KINDLE_LOG" | sed '/^$/d' >>kindle.log
          tail -n 5000 kindle.log >kindle.tmp && mv kindle.tmp kindle.log
          if [ -n "$KINDLE_DEVICE" ]; then
            printf '%s  %s\n' "$(TZ=America/New_York date '+%Y-%m-%d %H:%M %Z')" "$KINDLE_DEVICE" >status.txt
          fi
          git add -A
          git commit -q -m "Kindle log $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q --force "$url" HEAD:logs

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: pip install --quiet pillow

      - name: Render
        run: python render/render.py --out out/dashboard.png

      # The Kindle's own scripts, for its over-the-air updates (kindle/dashboard/bin/update.sh).
      # The version is the git tree hash of kindle/dashboard, so it changes only when that folder does.
      - name: Bundle the Kindle scripts
        run: |
          v="$(git rev-parse HEAD:kindle/dashboard | cut -c1-12)"
          mkdir -p out/bundle
          git archive HEAD:kindle/dashboard | tar -x -C out/bundle
          echo "$v" >out/bundle/VERSION
          tar --format=ustar --owner=0 --group=0 --numeric-owner --sort=name -cf out/kindle.tar -C out/bundle .
          echo "$v" >out/kindle.version
          rm -rf out/bundle
          echo "Kindle bundle $v: $(wc -c <out/kindle.tar) bytes"

      # Publish as a single orphan commit so the repo history doesn't grow every hour.
      # dashboard.png is the screen; meta.json (render time), stale.png, offline.png and night.png go with it.
      # menu.png is page 2 (the meal plan); it is optional, so a failed menu render never blocks the dashboard.
      # kindle.tar and kindle.version are the Kindle's scripts.
      - name: Publish to the output branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard.png meta.json stale.png offline.png night.png kindle.tar kindle.version
          if [ -f menu.png ]; then git add menu.png; fi
          git commit -q -m "Dashboard $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" output
